on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    uses: CTTIR/.github/.github/workflows/test-coverage.yaml@main
    with:
      # The current suite covers over 94% of the package. Fail regressions
      # below 90% using the shared workflow's explicit covr gate.
      floor: 90
    secrets: inherit
