name: Retire public author from private filter
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare-encrypted-update:
    if: github.actor == 'r-heller'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install signed distribution encryption library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-nacl
      - name: Prepare encrypted filter update
        env:
          CTTIR_PRIVATE_TERMS: ${{ secrets.CTTIR_PRIVATE_TERMS }}
          GITHUB_SECRET_PUBLIC_KEY: 'DCMZ8NL5g9sWIYQOLShAiydQdXwCiecegMyzR+6ZtEI='
          GITHUB_SECRET_KEY_ID: '3380204578043523366'
        run: /usr/bin/python3 tools/maintenance/retire-public-author-filter.py
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-author-filter-update
          path: ${{ runner.temp }}/author-filter-update.json
          retention-days: 1
          if-no-files-found: error
